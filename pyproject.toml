[project]
name = "printing-mcp"
version = "0.1.6"
description = "All-in-one MCP server for Blender modeling and 3D-print slicing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "gcode-lib>=1.1.13",
    "google-genai>=1.54.0",
    "mcp>=1.27.0",
    "modal>=1.2.0",
    "paho-mqtt>=2.1.0",
    "pillow>=12.0.0",
    "pydantic>=2",
    "trimesh>=4.12.1",
    "websockets>=16.0",
]

[project.optional-dependencies]
cad = [
    "build123d>=0.10.0",
]

[project.scripts]
printing-mcp = "printing_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printing_mcp"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "ty>=0.0.32",
]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
